<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Origin playground</title>
<style>
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 1.5rem; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 .25rem; }
  p.note { margin: 0 0 1rem; color: #555; font-family: system-ui, sans-serif; }
  textarea { width: 100%; height: 16rem; font: inherit; padding: .5rem; box-sizing: border-box; }
  .controls { margin: .75rem 0; display: flex; gap: .5rem; align-items: center; }
  button { font: inherit; padding: .35rem .9rem; }
  pre { background: #f4f4f4; padding: .75rem; white-space: pre-wrap; word-break: break-word; min-height: 3rem; }
  pre.err { background: #fdf0f0; }
  .host { color: #666; font-style: italic; font-family: system-ui, sans-serif; }
  label { font-family: system-ui, sans-serif; }
</style>
</head>
<body>

<h1>Origin playground</h1>
<p class="note">
  Everything below runs in this tab. Your code is never uploaded, and nothing about this run
  reaches a server. This page is the Phase&nbsp;10 proof harness — a plain textarea, no editor.
</p>

<textarea id="src" spellcheck="false">use std::io;

fn fib(n: i64) -> i64 {
    if n < 2 { n } else { fib(n - 1) + fib(n - 2) }
}

fn main() {
    let mut i = 0;
    while i &lt;= 10 {
        io::println(fib(i).to_str());
        i = i + 1;
    }
}
</textarea>

<div class="controls">
  <button id="run">Run</button>
  <button id="stop" disabled>Stop</button>
  <label>engine
    <select id="engine"><option value="vm">vm</option><option value="interp">interp</option></select>
  </label>
  <label>opt
    <select id="opt"><option>0</option><option selected>1</option><option>2</option></select>
  </label>
  <span id="status" class="host"></span>
</div>

<strong>stdout</strong>
<pre id="stdout"></pre>
<strong>stderr</strong>
<pre id="stderr" class="err"></pre>
<div id="host" class="host"></div>

<script>
const $ = (id) => document.getElementById(id);
let worker = null;

function setRunning(running) {
  $("run").disabled = running;
  $("stop").disabled = !running;
  $("status").textContent = running ? "running…" : "";
}

// A terminated worker is a discarded module (ADR-0036): the next run starts a fresh one
// rather than inheriting whatever state a killed program was in.
function stop(reason) {
  if (!worker) return;
  worker.terminate();
  worker = null;
  setRunning(false);
  if (reason) $("host").textContent = reason;
}

$("run").onclick = () => {
  stop(null);
  $("stdout").textContent = "";
  $("stderr").textContent = "";
  $("host").textContent = "";
  setRunning(true);

  worker = new Worker("worker.js");
  worker.onmessage = (e) => {
    const m = e.data;
    if (m.kind === "output") {
      $(m.stream).textContent += m.text;
      return;
    }
    if (m.kind === "failed") {
      // The host speaking about the run, never the program's own output (spec §7).
      $("host").textContent = "the playground could not run this: " + m.message;
      stop(null);
      return;
    }
    // `done` carries the full captured streams; the chunks above were the same bytes
    // delivered early, so assigning here is idempotent rather than additive.
    $("stdout").textContent = m.stdout;
    $("stderr").textContent = m.stderr;
    let host = "exit status " + m.exit;
    if (m.truncated) host += " · output truncated at the 4 MiB ceiling";
    if (m.internalError) host += " · " + m.internalError;
    $("host").textContent = host;
    stop(null);
  };
  worker.postMessage({
    source: $("src").value,
    engine: $("engine").value,
    opt: Number($("opt").value),
  });
};

$("stop").onclick = () => stop("stopped by you — the program did not finish");
</script>

</body>
</html>
