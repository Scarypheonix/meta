<svg xmlns="http://www.w3.org/2000/svg" width="545" height="386" viewBox="0 0 545 386" role="img" aria-label="Origin source">
<rect x="0" y="0" width="545" height="386" rx="8" fill="#ffffff" stroke="#e2e2df"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">
<text x="18" y="29.0"><tspan fill="#8250a8">let</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#1a1a1a">score</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">=</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#9a5518">87</tspan></text>
<text x="18" y="49.8"></text>
<text x="18" y="70.6"><tspan fill="#8250a8">if</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#1a1a1a">score</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">&gt;=</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#9a5518">90</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">{</tspan></text>
<text x="18" y="91.4"><tspan fill="#1a1a1a">    </tspan><tspan fill="#2f5d7c">println</tspan><tspan fill="#55606b">(</tspan><tspan fill="#3f7a3f">"top marks"</tspan><tspan fill="#55606b">)</tspan></text>
<text x="18" y="112.2"><tspan fill="#55606b">}</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#8250a8">else</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#8250a8">if</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#1a1a1a">score</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">&gt;=</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#9a5518">60</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">{</tspan></text>
<text x="18" y="133.0"><tspan fill="#1a1a1a">    </tspan><tspan fill="#2f5d7c">println</tspan><tspan fill="#55606b">(</tspan><tspan fill="#3f7a3f">"a pass"</tspan><tspan fill="#55606b">)</tspan></text>
<text x="18" y="153.8"><tspan fill="#55606b">}</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#8250a8">else</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">{</tspan></text>
<text x="18" y="174.6"><tspan fill="#1a1a1a">    </tspan><tspan fill="#2f5d7c">println</tspan><tspan fill="#55606b">(</tspan><tspan fill="#3f7a3f">"not this time"</tspan><tspan fill="#55606b">)</tspan></text>
<text x="18" y="195.4"><tspan fill="#55606b">}</tspan></text>
<text x="18" y="216.2"></text>
<text x="18" y="237.0"><tspan fill="#8a8a85" font-style="italic">// A match is the same idea when there is a fixed set of answers.</tspan></text>
<text x="18" y="257.8"><tspan fill="#8250a8">let</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#1a1a1a">day</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">=</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#3f7a3f">"sat"</tspan></text>
<text x="18" y="278.6"><tspan fill="#8250a8">match</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#1a1a1a">day</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">{</tspan></text>
<text x="18" y="299.4"><tspan fill="#1a1a1a">    </tspan><tspan fill="#3f7a3f">"sat"</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">=&gt;</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#2f5d7c">println</tspan><tspan fill="#55606b">(</tspan><tspan fill="#3f7a3f">"weekend"</tspan><tspan fill="#55606b">)</tspan><tspan fill="#55606b">,</tspan></text>
<text x="18" y="320.2"><tspan fill="#1a1a1a">    </tspan><tspan fill="#3f7a3f">"sun"</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">=&gt;</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#2f5d7c">println</tspan><tspan fill="#55606b">(</tspan><tspan fill="#3f7a3f">"weekend"</tspan><tspan fill="#55606b">)</tspan><tspan fill="#55606b">,</tspan></text>
<text x="18" y="341.0"><tspan fill="#1a1a1a">    </tspan><tspan fill="#1a1a1a">other</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">=&gt;</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#2f5d7c">println</tspan><tspan fill="#55606b">(</tspan><tspan fill="#3f7a3f">"\(other) is a school day"</tspan><tspan fill="#55606b">)</tspan><tspan fill="#55606b">,</tspan></text>
<text x="18" y="361.8"><tspan fill="#55606b">}</tspan></text>
</g>
</svg>
