<svg xmlns="http://www.w3.org/2000/svg" width="467" height="261" viewBox="0 0 467 261" role="img" aria-label="Origin source">
<rect x="0" y="0" width="467" height="261" rx="8" fill="#ffffff" stroke="#e2e2df"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">
<text x="18" y="29.0"><tspan fill="#8250a8">let</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#1a1a1a">names</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">=</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">[</tspan><tspan fill="#3f7a3f">"ada"</tspan><tspan fill="#55606b">,</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#3f7a3f">"grace"</tspan><tspan fill="#55606b">,</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#3f7a3f">"alan"</tspan><tspan fill="#55606b">,</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#3f7a3f">"edsger"</tspan><tspan fill="#55606b">]</tspan></text>
<text x="18" y="49.8"></text>
<text x="18" y="70.6"><tspan fill="#2f5d7c">println</tspan><tspan fill="#55606b">(</tspan><tspan fill="#3f7a3f">"there are \(names.len()) of them"</tspan><tspan fill="#55606b">)</tspan></text>
<text x="18" y="91.4"><tspan fill="#2f5d7c">println</tspan><tspan fill="#55606b">(</tspan><tspan fill="#1a1a1a">names</tspan><tspan fill="#55606b">.</tspan><tspan fill="#2f5d7c">join</tspan><tspan fill="#55606b">(</tspan><tspan fill="#3f7a3f">", "</tspan><tspan fill="#55606b">)</tspan><tspan fill="#55606b">)</tspan></text>
<text x="18" y="112.2"></text>
<text x="18" y="133.0"><tspan fill="#8250a8">let</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#1a1a1a">long</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">=</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#1a1a1a">names</tspan><tspan fill="#55606b">.</tspan><tspan fill="#2f5d7c">filter</tspan><tspan fill="#55606b">(</tspan><tspan fill="#55606b">|</tspan><tspan fill="#1a1a1a">n</tspan><tspan fill="#55606b">|</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#1a1a1a">n</tspan><tspan fill="#55606b">.</tspan><tspan fill="#2f5d7c">len</tspan><tspan fill="#55606b">(</tspan><tspan fill="#55606b">)</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">&gt;</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#9a5518">4</tspan><tspan fill="#55606b">)</tspan></text>
<text x="18" y="153.8"><tspan fill="#2f5d7c">println</tspan><tspan fill="#55606b">(</tspan><tspan fill="#3f7a3f">"longer than four letters: \(long.join(", "))"</tspan><tspan fill="#55606b">)</tspan></text>
<text x="18" y="174.6"></text>
<text x="18" y="195.4"><tspan fill="#8250a8">for</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#1a1a1a">n</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#8250a8">in</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#2f5d7c">range</tspan><tspan fill="#55606b">(</tspan><tspan fill="#9a5518">1</tspan><tspan fill="#55606b">,</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#9a5518">4</tspan><tspan fill="#55606b">)</tspan><tspan fill="#1a1a1a"> </tspan><tspan fill="#55606b">{</tspan></text>
<text x="18" y="216.2"><tspan fill="#1a1a1a">    </tspan><tspan fill="#2f5d7c">println</tspan><tspan fill="#55606b">(</tspan><tspan fill="#3f7a3f">"\(n) squared is \(n * n)"</tspan><tspan fill="#55606b">)</tspan></text>
<text x="18" y="237.0"><tspan fill="#55606b">}</tspan></text>
</g>
